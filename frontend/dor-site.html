<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOR Messenger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e1117;
    --bg2:       #161b22;
    --bg3:       #1c2333;
    --bg4:       #21262d;
    --border:    #30363d;
    --accent:    #00b894;
    --accent2:   #00cec9;
    --text:      #e6edf3;
    --text2:     #8b949e;
    --text3:     #6e7681;
    --bubble-me: #1a3a2e;
    --bubble-other: #1c2333;
    --danger:    #f85149;
    --online:    #3fb950;
    --radius:    12px;
  }

  html, body { height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ====== LOGIN PAGE ====== */
  #login-page {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  #login-page::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,184,148,0.08) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .login-box {
    width: 100%; max-width: 380px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    position: relative;
    z-index: 1;
  }

  .login-logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 28px;
  }

  .login-logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .login-logo h1 {
    font-size: 22px; font-weight: 600; color: var(--text);
    letter-spacing: -0.3px;
  }

  .login-logo span {
    font-size: 11px; color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
    display: block;
  }

  .login-tabs {
    display: flex; gap: 0;
    background: var(--bg3);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 24px;
  }

  .login-tab {
    flex: 1; padding: 8px;
    text-align: center; font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: 6px;
    color: var(--text2); transition: all 0.2s;
    border: none; background: none;
  }

  .login-tab.active { background: var(--bg4); color: var(--text); }

  .login-group { margin-bottom: 16px; }

  .login-group label {
    font-size: 12px; font-weight: 500; color: var(--text2);
    display: block; margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .login-group input {
    width: 100%; padding: 10px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text); font-size: 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    outline: none; transition: border-color 0.2s;
  }

  .login-group input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%; padding: 11px;
    background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer;
    margin-top: 4px; transition: opacity 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .login-btn:hover { opacity: 0.88; }

  .login-badge {
    margin-top: 20px;
    background: rgba(0,184,148,0.08);
    border: 1px solid rgba(0,184,148,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px; color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.6;
  }

  .login-badge strong { display: block; margin-bottom: 3px; font-size: 11px; }

  .login-error {
    color: var(--danger); font-size: 12px;
    margin-top: 8px; display: none;
  }

  /* ====== APP ====== */
  #app { display: none; height: 100vh; flex-direction: column; }

  .app-layout {
    display: flex; flex: 1; overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 320px; min-width: 260px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .sidebar-logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
  }

  .sidebar-logo-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  .sidebar-me {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    flex-shrink: 0;
  }

  .avatar.me { background: var(--accent); color: #fff; }
  .avatar.a { background: #6c5ce7; color: #fff; }
  .avatar.b { background: #e17055; color: #fff; }
  .avatar.c { background: #0984e3; color: #fff; }
  .avatar.d { background: #d63031; color: #fff; }
  .avatar.e { background: #00b894; color: #fff; }
  .avatar.f { background: #fdcb6e; color: #222; }

  .me-info { flex: 1; }
  .me-name { font-size: 13px; font-weight: 500; }
  .me-status {
    font-size: 11px; color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; gap: 4px;
  }

  .me-status::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--online); border-radius: 50%;
    display: inline-block;
  }

  .logout-btn {
    font-size: 11px; color: var(--text3);
    background: none; border: none; cursor: pointer;
    padding: 4px 8px; border-radius: 4px;
    transition: color 0.2s;
  }

  .logout-btn:hover { color: var(--danger); }

  .search-bar {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .search-bar input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text); font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    outline: none;
  }

  .contacts-label {
    padding: 8px 16px 4px;
    font-size: 10px; font-weight: 600;
    color: var(--text3); letter-spacing: 1px;
    text-transform: uppercase;
  }

  .contacts-list { flex: 1; overflow-y: auto; }

  .contact-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    position: relative;
  }

  .contact-item:hover { background: var(--bg3); }
  .contact-item.active { background: var(--bg3); border-left-color: var(--accent); }

  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 13px; font-weight: 500; }
  .contact-last {
    font-size: 12px; color: var(--text2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .contact-meta { text-align: right; }
  .contact-time { font-size: 10px; color: var(--text3); }
  .contact-badge {
    background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 600;
    border-radius: 10px; padding: 1px 6px;
    display: inline-block; margin-top: 3px;
  }

  .online-dot {
    width: 8px; height: 8px;
    background: var(--online); border-radius: 50%;
    position: absolute; bottom: 10px; left: 39px;
    border: 2px solid var(--bg2);
  }

  /* CHAT */
  .chat-area {
    flex: 1; display: flex; flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  .chat-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    display: flex; align-items: center; gap: 12px;
  }

  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-status {
    font-size: 11px; color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
  }

  .route-info {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text2);
    cursor: pointer; transition: border-color 0.2s;
  }

  .route-info:hover { border-color: var(--accent); color: var(--accent); }
  .route-icon { font-size: 13px; }

  .chat-messages {
    flex: 1; overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex; flex-direction: column; gap: 4px;
  }

  .day-divider {
    text-align: center; margin: 12px 0;
    font-size: 11px; color: var(--text3);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; gap: 10px;
  }

  .day-divider::before, .day-divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  .msg {
    display: flex; flex-direction: column;
    max-width: 68%;
    margin-bottom: 2px;
  }

  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }

  .msg-sender {
    font-size: 11px; color: var(--accent);
    font-weight: 500; margin-bottom: 3px;
    padding-left: 4px;
  }

  .msg-bubble {
    padding: 9px 14px;
    border-radius: 12px;
    font-size: 14px; line-height: 1.5;
    word-break: break-word;
    position: relative;
  }

  .msg.me .msg-bubble {
    background: var(--bubble-me);
    border: 1px solid rgba(0,184,148,0.2);
    border-bottom-right-radius: 4px;
  }

  .msg.other .msg-bubble {
    background: var(--bubble-other);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-meta {
    font-size: 10px; color: var(--text3);
    margin-top: 3px; padding: 0 4px;
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .msg-route {
    font-size: 10px; color: var(--text3);
    display: flex; align-items: center; gap: 3px;
  }

  .msg-ack { color: var(--accent); }

  .msg-system {
    align-self: center;
    font-size: 11px; color: var(--text3);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    margin: 8px 0;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* typing indicator */
  .typing-indicator {
    display: none;
    align-self: flex-start;
    padding: 10px 16px;
    background: var(--bubble-other);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-bottom-left-radius: 4px;
  }

  .typing-dots { display: flex; gap: 4px; align-items: center; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text3);
    animation: typing 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  /* INPUT */
  .chat-input-area {
    padding: 12px 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex; align-items: flex-end; gap: 10px;
  }

  .input-wrapper {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex; align-items: flex-end;
    padding: 8px 12px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within { border-color: var(--accent); }

  #msg-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px; resize: none;
    font-family: 'IBM Plex Sans', sans-serif;
    max-height: 120px; line-height: 1.5;
  }

  .send-btn {
    width: 40px; height: 40px;
    background: var(--accent);
    border: none; border-radius: 10px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.2s;
    font-size: 16px;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ROUTE MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 420px; max-width: 90vw;
  }

  .modal h3 {
    font-size: 15px; font-weight: 600;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }

  .route-steps {
    display: flex; flex-direction: column; gap: 0;
  }

  .route-step {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    position: relative;
  }

  .route-step:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 15px; top: 46px;
    width: 2px; height: calc(100% - 16px);
    background: var(--border);
  }

  .route-step-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; z-index: 1;
    border: 2px solid var(--border);
  }

  .route-step-icon.src { background: var(--accent); border-color: var(--accent); }
  .route-step-icon.relay { background: var(--bg3); }
  .route-step-icon.dst { background: #6c5ce7; border-color: #6c5ce7; }

  .route-step-info { flex: 1; }
  .route-step-name { font-size: 13px; font-weight: 500; }
  .route-step-detail {
    font-size: 11px; color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
  }

  .route-step-badge {
    font-size: 10px; padding: 2px 8px;
    border-radius: 20px; font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }

  .badge-src { background: rgba(0,184,148,0.15); color: var(--accent); }
  .badge-relay { background: rgba(139,148,158,0.15); color: var(--text2); }
  .badge-dst { background: rgba(108,92,231,0.15); color: #a29bfe; }
  .badge-enc { background: rgba(248,81,73,0.1); color: #ff7675; font-size: 9px; }

  .modal-close {
    margin-top: 20px; width: 100%;
    padding: 9px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: border-color 0.2s;
  }

  .modal-close:hover { border-color: var(--accent); }

  /* NO CHAT SELECTED */
  .no-chat {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text3);
  }

  .no-chat-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .no-chat h3 { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text2); }
  .no-chat p { font-size: 13px; text-align: center; max-width: 260px; line-height: 1.6; }

  /* MOBILE */
  @media (max-width: 700px) {
    .sidebar { width: 100%; display: flex; }
    .chat-area { display: none; }
    .app-layout.chat-open .sidebar { display: none; }
    .app-layout.chat-open .chat-area { display: flex; }
    .back-btn { display: flex !important; }
  }

  .back-btn {
    display: none;
    align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--text2); cursor: pointer;
    font-size: 13px; padding: 4px 8px;
    border-radius: 6px; transition: color 0.2s;
  }

  .back-btn:hover { color: var(--text); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* FADE IN */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg { animation: fadeIn 0.2s ease; }
</style>
</head>
<body>
<!-- APP -->
<div id="app">
  <div class="app-layout" id="app-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">🧅</div>
          DOR Messenger
        </div>
      </div>

      <div class="sidebar-me">
        <div class="avatar me" id="my-avatar">?</div>
        <div class="me-info">
          <div class="me-name" id="my-name">Moi</div>
          <div class="me-status">connecté · nœud actif</div>
        </div>
        <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="🔍 Rechercher..." id="search-input" oninput="filterContacts()">
      </div>

      <div class="contacts-label">UTILISATEURS EN LIGNE</div>
      <div class="contacts-list" id="contacts-list"></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chat-area">

      <!-- No chat selected -->
      <div class="no-chat" id="no-chat">
        <div class="no-chat-icon">🧅</div>
        <h3>DOR Messenger</h3>
        <p>Sélectionnez un contact pour démarrer une conversation anonyme et chiffrée.</p>
      </div>

      <!-- Active chat -->
      <div id="active-chat" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-header">
          <button class="back-btn" id="back-btn" onclick="closeChat()">← Retour</button>
          <div class="avatar" id="chat-avatar">?</div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="chat-name">Contact</div>
            <div class="chat-header-status" id="chat-status">en ligne · nœud actif</div>
          </div>
          <div class="route-info" onclick="showRouteModal()" title="Voir le chemin de chiffrement">
            <span class="route-icon">🔐</span>
            <span id="route-label">3 relais</span>
          </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="typing-indicator" id="typing-indicator">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="chat-input-area">
          <div class="input-wrapper">
            <textarea id="msg-input" rows="1" placeholder="Écrivez un message..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          </div>
          <button class="send-btn" onclick="sendMessage()" id="send-btn">➤</button>
          <input type="file" id="file-input" style="display:none" onchange="uploadFile()">
          <button onclick="document.getElementById('file-input').click()">📎</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ROUTE MODAL -->
<div class="modal-overlay" id="route-modal" onclick="closeModal(event)">
  <div class="modal">
    <h3>🔐 Chemin de chiffrement</h3>
    <div class="route-steps" id="route-steps"></div>
    <button class="modal-close" onclick="document.getElementById('route-modal').classList.remove('show')">Fermer</button>
  </div>
</div>

<script>
/* =========================
   STATE GLOBAL
========================= */

let currentChat = null;
let conversations = {};
let contacts = [];

// utilisateur local (remplace login)
const currentUser = "Node-1";

/* =========================
   INIT UI
========================= */

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById('app').style.display = 'flex';

  document.getElementById('my-name').textContent = currentUser;
  document.getElementById('my-avatar').textContent = currentUser[0].toUpperCase();

  contacts = [
    { id: "alice", name: "Alice", avatar: "a", profile: "WiFi" },
    { id: "bob", name: "Bob", avatar: "b", profile: "4G" },
    { id: "bot-1", name: "Relay-1", avatar: "d", profile: "NODE" }
  ];

  renderContacts();
});

/* =========================
   CONTACTS
========================= */

function renderContacts(filter = '') {
  const list = document.getElementById('contacts-list');
  list.innerHTML = '';

  contacts
    .filter(u => u.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(user => {

      const msgs = conversations[user.id] || [];
      const last = msgs[msgs.length - 1];

      const unread = msgs.filter(m => m.from !== 'me' && !m.read).length;

      const item = document.createElement('div');
      item.className = 'contact-item' + (currentChat === user.id ? ' active' : '');

      item.onclick = () => openChat(user.id);

      item.innerHTML = `
        <div class="avatar ${user.avatar}">
          ${user.name[0].toUpperCase()}
        </div>

        <div class="online-dot"></div>

        <div class="contact-info">
          <div class="contact-name">${user.name}</div>
          <div class="contact-last">
            ${last ? (last.from === 'me' ? '→ ' : '') + last.text : '📡 ' + user.profile}
          </div>
        </div>

        <div class="contact-meta">
          <div class="contact-time">${last ? last.time : ''}</div>
          ${unread > 0 ? `<span class="contact-badge">${unread}</span>` : ''}
        </div>
      `;

      list.appendChild(item);
    });
}

function filterContacts() {
  renderContacts(document.getElementById('search-input').value);
}

/* =========================
   CHAT LOGIC
========================= */

async function openChat(userId) {
  currentChat = userId;

  const user = contacts.find(u => u.id === userId);

  document.getElementById('no-chat').style.display = 'none';
  const ac = document.getElementById('active-chat');
  ac.style.display = 'flex';

  document.getElementById('chat-name').textContent = user.name;
  document.getElementById('chat-avatar').textContent = user.name[0].toUpperCase();
  document.getElementById('chat-status').textContent = `en ligne · ${user.profile}`;

  await loadMessages(userId);

  renderContacts();
}

function closeChat() {
  document.getElementById('app-layout').classList.remove('chat-open');
  currentChat = null;
}

/* =========================
   MESSAGES
========================= */

function renderMessages() {
  const container = document.getElementById('chat-messages');

  const isNearBottom =
    container.scrollHeight - container.scrollTop - container.clientHeight < 50;

  const msgs = conversations[currentChat] || [];

  container.innerHTML = `<div class="day-divider">Aujourd'hui</div>`;

  msgs.forEach(msg => {
    const isMe = msg.from === 'me';

    const div = document.createElement('div');
    div.className = `msg ${isMe ? 'me' : 'other'}`;

    div.innerHTML = `
      ${!isMe ? `<div class="msg-sender">${msg.from}</div>` : ''}
      <div class="msg-bubble">${renderContent(msg.text)}</div>
      <div class="msg-meta">
        ${msg.time}
        ${msg.ack ? `<span class="msg-ack">✓✓</span>` : ''}
      </div>
    `;

    container.appendChild(div);
  });

  if (isNearBottom) {
    container.scrollTop = container.scrollHeight;
  }
}

function renderContent(text) {
  if (text.startsWith("📎")) {
    const filename = text.replace("📎 ", "");
    const url = "/uploads/" + filename.split("/").pop();

    if (filename.match(/\.(jpg|jpeg|png|gif)$/i)) {
      return `<img src="${url}" style="max-width:200px;border-radius:8px;">`;
    }

    return `<a href="${url}" target="_blank">${filename}</a>`;
  }

  return escHtml(text);
}

async function uploadFile() {
  const input = document.getElementById("file-input");
  const file = input.files[0];

  if (!file || !currentChat) return;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("sender", currentUser);
  formData.append("receiver", currentChat);

  const res = await fetch("/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  // affichage
  const now = new Date();
  const time = now.toLocaleTimeString().slice(0,5);

  const msg = {
    from: 'me',
    text: `📎 ${file.name}`,
    time,
    ack: true
  };

  if (!conversations[currentChat]) {
    conversations[currentChat] = [];
  }

  conversations[currentChat].push(msg);

  renderMessages();
}

/* =========================
   SEND MESSAGE (READY FOR GO BACKEND)
========================= */

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();

  if (!text || !currentChat) return;

  const now = new Date();
  const time = now.toLocaleTimeString().slice(0,5);

  // affichage immédiat (optimiste)
  const msg = {
    from: 'me',
    text,
    time,
    ack: false
  };

  if (!conversations[currentChat]) {
    conversations[currentChat] = [];
  }

  conversations[currentChat].push(msg);
  renderMessages();

  input.value = '';
  autoResize(input);

  try {
    await fetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sender: currentUser,
        receiver: currentChat,
        type: "text",
        content: text,
        filename: ""
      })
    });

    msg.ack = true;
  } catch (e) {
    console.error(e);
  }

  renderMessages();
  renderContacts();
}

async function loadMessages(userId) {
  const res = await fetch(`/messages?sender=${currentUser}&receiver=${userId}`);
  const data = await res.json();

  conversations[userId] = data.map(m => ({
    from: m.sender === currentUser ? 'me' : m.sender,
    text: m.type === "text"
      ? m.content
      : `📎 ${m.filename}`,
    time: m.time?.slice(11,16) || "",
    ack: true
  }));

  renderMessages();
}

/* =========================
   UTILS
========================= */

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;');
}

</script>
